info:
  name: Suche mit Suchparameter
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: "{{oidcTokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: body
    resourceOwner:
      username: "{{username}}"
      password: "{{password}}"
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
  variables:
    - name: clientSecret
      value: 1ZrjDc99bHka9wjfXMa42NodHIxvjoOB
    - name: clientId
      value: python-client
    - name: password
      value: p
    - name: username
      value: admin

docs:
  content: Suche nach Patienten über die REST-Schnittstellen mit flexiblen Suchparameter.
  type: text/markdown
