info:
  name: Suche id, version, ... von Autohaeusern mit der Emailadresse
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($email: String = "kontakt@autohaus-karlsruhe.de") {
        autohaeuser(suchparameter: {email: $email}) {
          id
          version
          name
          username
          email
          anzahlFahrzeuge
          gruendungsdatum
          homepage
          telefonnummer
          adresse {
            plz
            ort
            land
          }
        }
      }
    variables: |-
      {
        "email": "kontakt@autohaus-karlsruhe.de"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.autohaeuser
      operator: isArray
    - expression: res.body.data.autohaeuser
      operator: length
      value: "1"
    - expression: res.body.data.autohaeuser[0]
      operator: isJson
    - expression: res.body.data.autohaeuser[0].id
      operator: gte
      value: "0"
    - expression: res.body.data.autohaeuser[0].version
      operator: gte
      value: "0"
    - expression: res.body.data.autohaeuser[0].name
      operator: isString
    - expression: res.body.data.autohaeuser[0].name
      operator: isNotEmpty
    - expression: res.body.data.autohaeuser[0].username
      operator: isString
    - expression: res.body.data.autohaeuser[0].username
      operator: isNotEmpty
    - expression: res.body.data.autohaeuser[0].email
      operator: isString
    - expression: res.body.data.autohaeuser[0].email
      operator: isNotEmpty
    - expression: res.body.data.autohaeuser[0].anzahlFahrzeuge
      operator: gte
      value: "0"
    - expression: res.body.data.autohaeuser[0].gruendungsdatum
      operator: isString
    - expression: res.body.data.autohaeuser[0].adresse
      operator: isJson
    - expression: res.body.data.autohaeuser[0].adresse.plz
      operator: isString
    - expression: res.body.data.autohaeuser[0].adresse.ort
      operator: isString
    - expression: res.body.data.autohaeuser[0].adresse.land
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
