info:
  name: Suche id, version, ... von Autohaeusern mit der Emailadresse
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($email: String = "kontakt@autohaus-karlsruhe.de") {
        autohaeuser(suchparameter: {email: $email}) {
          id
          version
          name
          username
          email
          anzahlFahrzeuge
          gruendungsdatum
          homepage
          telefonnummer
          adresse {
            plz
            ort
            land
          }
        }
      }
    variables: |-
      {
        "email": "kontakt@autohaus-karlsruhe.de"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.autohaeuser[0].name
      operator: isString
    - expression: res.body.data.autohaeuser[0].name
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
