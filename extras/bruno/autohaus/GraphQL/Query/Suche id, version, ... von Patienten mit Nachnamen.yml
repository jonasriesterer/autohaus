info:
  name: Suche id, version, ... von Patienten mit Nachnamen
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($name: String = "Test") {
        patienten: autohaeuser(suchparameter: {name: $name}) {
          id
          version
          name
          username
          email
          anzahlFahrzeuge
          gruendungsdatum
          homepage
          telefonnummer
          adresse {
            plz
            ort
            land
          }
        }
      }
    variables: |-
      {
        "name": "Test"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Body mit den Properties', () => {
          res.getBody()
            .data
            .patienten
            .forEach(autohaus => {
              const { id, version, name, username, email, anzahlFahrzeuge, gruendungsdatum, homepage, telefonnummer, adresse } = autohaus;
              expect(id).to.be.gte(0);
              expect(version).to.be.gte(0);
              expect(name).to.be.a('string').that.is.not.empty;
              expect(username).to.be.a('string').that.is.not.empty;
              expect(email).to.be.a('string').that.is.not.empty;
              expect(anzahlFahrzeuge).to.be.gte(0);
              expect(gruendungsdatum).to.be.a('string');
              expect(homepage).to.be.a('string');
              expect(telefonnummer).to.be.a('string');
              expect(adresse).to.be.an('object');
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.patienten
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
