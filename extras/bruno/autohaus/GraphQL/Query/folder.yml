info:
  name: Query
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: "{{oidcTokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: body
    resourceOwner:
      username: "{{username}}"
      password: "{{password}}"
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
  variables:
    - name: username
      value: admin
    - name: password
      value: p
    - name: clientId
      value: python-client
    - name: clientSecret
      value: 1ZrjDc99bHka9wjfXMa42NodHIxvjoOB

docs:
  content: Mit der GraphQL-Schnittstelle werden Autohausdaten gelesen.
  type: text/markdown
