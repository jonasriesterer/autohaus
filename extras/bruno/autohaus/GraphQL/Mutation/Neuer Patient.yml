info:
  name: Neuer Patient
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      mutation {
        create(
          autohausInput: {
            name: "Autohof GraphQL"
            username: "testgraphql"
            email: "testgraphql@test.graphql"
            anzahlFahrzeuge: 9
            gruendungsdatum: "2022-02-02"
            homepage: "https://test.graphql"
            telefonnummer: "+49 123 456789"
            adresse: {
              plz: "99999"
              ort: "Testort"
              land: "Testland"
            }
            autos: [{
              kennzeichen: "G-1234"
              marke: "VW"
              modell: "Golf"
              baujahr: "2020"
            }]
          }
        ) {
          id
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data
      operator: isJson
    - expression: res.body.data.create.id
      operator: gte
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
