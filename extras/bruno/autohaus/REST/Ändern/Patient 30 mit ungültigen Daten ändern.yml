info:
  name: Autohaus 30 mit ungültigen Daten ändern
  type: http
  seq: 6

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"0"'
  params:
    - name: id
      value: "100"
      type: path
  body:
    type: json
    data: |-
      {
          "name": "",
          "username": "",
          "email": "falsche_email_put@",
          "anzahl_fahrzeuge": 0,
          "gruendungsdatum": "2022-03-03",
          "homepage": "https://?!",
          "telefonnummer": "not-a-number"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.detail
      operator: isArray
    - expression: res.body.detail
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
