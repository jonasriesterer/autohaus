info:
  name: Autohaus 30 mit bereits existierender Emailadresse ändern
  type: http
  seq: 7

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"1"'
  params:
    - name: id
      value: "30"
      type: path
  body:
    type: json
    data: |-
      {
          "name": "Autohaus Test",
          "username": "alice_put",
          "email": "alice@acme.de",
          "anzahl_fahrzeuge": 9,
          "gruendungsdatum": "2022-01-09",
          "homepage": "https://www.acme.ch.put",
          "telefonnummer": "+49 123 456789"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.detail
      operator: contains
      value: Email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
