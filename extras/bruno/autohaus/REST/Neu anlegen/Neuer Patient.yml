info:
  name: Neues Autohaus
  type: http
  seq: 1

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
          "name": "Autohaus Test",
          "username": "anlegentest",
          "email": "anlegentest@test.rest",
          "anzahl_fahrzeuge": 5,
          "gruendungsdatum": "2022-02-01",
          "homepage": "https://test.rest",
          "telefonnummer": "+49 123 456789",
          "adresse": {
              "plz": "99999",
              "ort": "Restort",
              "land": "Testland"
          },
          "autos": [
              {
                  "kennzeichen": "AB123CD",
                  "marke": "VW",
                  "modell": "Golf",
                  "baujahr": "2020"
              }
          ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers.location
      operator: matches
      value: \/rest\/[1-9]\d*$
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
