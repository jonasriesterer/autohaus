info:
  name: Neues Autohaus mit bereits existierender Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
          "name": "Autohaus Test",
          "username": "emailexists",
          "email": "alice@acme.de",
          "anzahl_fahrzeuge": 5,
          "gruendungsdatum": "2022-02-01",
          "homepage": "https://test.rest",
          "telefonnummer": "+49 123 456789",
          "adresse": {
              "plz": "99999",
              "ort": "Restort",
              "land": "Testland"
          },
          "autos": [
              {
                  "kennzeichen": "AB123CD",
                  "marke": "VW",
                  "modell": "Golf",
                  "baujahr": "2020"
              }
          ]
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.detail
      operator: contains
      value: Email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
