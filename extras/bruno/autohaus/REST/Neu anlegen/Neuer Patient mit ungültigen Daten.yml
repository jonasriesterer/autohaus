info:
  name: Neues Autohaus mit ungültigen Daten
  type: http
  seq: 3

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
          "name": "falscher_name",
          "username": "test",
          "email": "falsche_email@",
          "anzahl_fahrzeuge": 0,
          "gruendungsdatum": "2022-02-01",
          "homepage": "https://?!",
          "telefonnummer": "not-a-number",
          "adresse": {
              "plz": "1234",
              "ort": "Restort",
              "land": ""
          },
          "autos": []
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.detail
      operator: isArray
    - expression: res.body.detail
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
