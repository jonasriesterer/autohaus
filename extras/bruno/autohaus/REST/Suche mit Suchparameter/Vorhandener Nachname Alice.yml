info:
  name: Vorhandener Name Autohaus Karlsruhe
  type: http
  seq: 3

http:
  method: GET
  url: "{{restUrl}}?name=Autohaus Karlsruhe"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: name
      value: Autohaus Karlsruhe
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Body: Name "Autohaus Karlsruhe" und ID > 0', () => {
          res.getBody()
            .content
            .forEach(autohaus => {
              const { name, id } = autohaus;
              expect(name).to.be.equal('Autohaus Karlsruhe');
              expect(id).to.be.above(0);
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.content
      operator: isArray
    - expression: res.body.content
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
