info:
  name: Suche mit ID OAuth 2 Authorization Code
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oidcAuthUrl}}"
    accessTokenUrl: "{{oidcTokenUrl}}"
    callbackUrl: "{{baseUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: body
    pkce:
      disabled: true
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
  variables:
    - name: clientSecret
      value: 1ZrjDc99bHka9wjfXMa42NodHIxvjoOB
    - name: clientId
      value: python-client
